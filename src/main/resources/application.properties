server.port=${PORT:8080}

spring.application.name=appointmed

# Limit the connection pool so it doesn't hog all 15 slots
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Prevent Hibernate from opening extra connections during startup
spring.jpa.hibernate.ddl-auto=none

# Database - using Render DATABASE_URL or Supabase defaults
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.evoxukcnbkbakmxbewqg}
spring.datasource.password=${DB_PASSWORD:uqDDUnfuocGUpN4G}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:AppointMedSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024SecureKey}
jwt.expiration=86400000

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null